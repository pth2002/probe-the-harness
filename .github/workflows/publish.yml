name: publish

# Push a tag such as v0.1.0 to build and publish to PyPI through trusted publishing.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          module=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('pth/__init__.py').read()).group(1))")
          echo "tag ${GITHUB_REF_NAME}, pyproject ${version}, pth.__version__ ${module}"
          test "v${version}" = "${GITHUB_REF_NAME}"
          test "${version}" = "${module}"
      - name: Build and check
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/probe-the-harness/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
